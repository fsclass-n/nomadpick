<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>상품 상세 | NomadPick</title>
  <link rel="icon" href="img/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<main class="container py-4">
  <a href="javascript:history.back()" class="text-secondary small"><i class="bi bi-arrow-left me-1"></i>목록으로</a>
  <div id="detail" class="mt-2"><div class="skeleton" style="height:260px"></div></div>

  <div class="row g-4 mt-1">
    <div class="col-lg-8">
      <div class="np-panel p-3 h-100">
        <h2 class="h3 mb-1">가격 추이 <small class="text-secondary fs-6 fw-normal">최근 30일 RPA 수집가</small></h2>
        <div id="priceChart" style="height:320px"></div>
      </div>
    </div>
    <div class="col-lg-4">
      <div class="np-panel p-3 h-100" id="flightPanel">
        <h2 class="h3 mb-1">항공편 정보</h2>
        <p class="text-secondary small mb-2">국토교통부 국내항공운항정보(TAGO) 기준</p>
        <div id="flights" class="small text-secondary">불러오는 중...</div>
      </div>
    </div>
  </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/common.js"></script>
<script src="js/product.js"></script>
</body>
</html>
