<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>맞춤 추천 | NomadPick</title>
  <link rel="icon" href="img/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<main class="container py-4">
  <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-end gap-3 mb-3">
    <div>
      <h1 class="mb-1"><i class="bi bi-stars text-warning me-1"></i>나를 위한 추천 Top 10</h1>
      <p class="text-secondary mb-0">선호 유사도(코사인) × 60 + 할인율 + 출발월 + 예산 적합도로 계산했습니다.</p>
    </div>
    <div class="d-flex gap-2">
      <a href="preferences.html" class="btn btn-outline-primary"><i class="bi bi-sliders me-1"></i>선호 변경</a>
      <button class="btn btn-success" id="excelBtn"><i class="bi bi-file-earmark-excel me-1"></i>엑셀 다운로드</button>
    </div>
  </div>
  <div class="np-panel p-3 mb-4 d-flex flex-wrap gap-2 align-items-center" id="prefSummary"><span class="text-secondary">선호 정보를 불러오는 중...</span></div>
  <div id="list" class="d-flex flex-column gap-3">
    <div class="skeleton" style="height:140px"></div><div class="skeleton" style="height:140px"></div>
  </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/common.js"></script>
<script src="js/recommend.js"></script>
</body>
</html>
