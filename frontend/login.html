<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>로그인 | NomadPick</title>
  <link rel="icon" href="img/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<main class="container py-5">
  <div class="np-auth mx-auto np-panel p-4 p-md-5">
    <h1 class="h2 mb-1">로그인</h1>
    <p class="text-secondary mb-4">로그인하고 내 취향에 맞는 특가를 추천받으세요.</p>
    <form id="loginForm" novalidate>
      <div class="mb-3">
        <label class="form-label" for="email">이메일</label>
        <input type="email" class="form-control form-control-lg" id="email" name="email" autocomplete="username" required>
      </div>
      <div class="mb-3">
        <label class="form-label" for="password">비밀번호</label>
        <input type="password" class="form-control form-control-lg" id="password" name="password" autocomplete="current-password" required>
      </div>
      <div class="alert alert-danger d-none py-2" id="error"></div>
      <button class="btn btn-primary btn-lg w-100" type="submit" id="submitBtn">로그인</button>
    </form>
    <p class="text-center text-secondary mt-4 mb-0">아직 회원이 아니신가요? <a href="signup.html">회원가입</a></p>
  </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/common.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
