<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>오늘의 특가 | NomadPick</title>
  <meta name="description" content="RPA가 하나투어·모두투어·노랑풍선 특가를 30분마다 수집하여 내 취향에 맞게 추천하는 NomadPick">
  <link rel="icon" href="img/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<main>
  <section class="np-hero pb-4 pt-4 mb-4">
    <div class="container">
      <div class="row align-items-center g-3">
        <div class="col-lg-7">
          <h1 class="mb-2">여러 여행사 특가, 한 번에 비교하세요</h1>
          <p class="lead mb-0">RPA가 하나투어 · 모두투어 · 노랑풍선의 특가를 30분마다 수집하고,<br class="d-none d-md-inline"> 내 여행 취향에 맞는 상품만 골라 추천합니다.</p>
        </div>
        <div class="col-lg-5">
          <div class="d-flex flex-wrap gap-2 justify-content-lg-end">
            <div class="np-stat"><small>수집 상품</small><strong id="statTotal">-</strong></div>
            <div class="np-stat"><small>여행사</small><strong id="statAgencies">3곳</strong></div>
            <div class="np-stat"><small>최근 수집</small><strong id="statUpdated">-</strong></div>
          </div>
        </div>
      </div>
    </div>
  </section>

  <div class="container">
    <!-- 필터 바: PC 는 상단 고정, 모바일은 오프캔버스 (BUG-03 조치) -->
    <div class="d-flex d-lg-none justify-content-between align-items-center mb-3">
      <button class="btn btn-outline-primary" data-bs-toggle="offcanvas" data-bs-target="#filterPanel"><i class="bi bi-funnel me-1"></i>필터</button>
      <select class="form-select w-auto" id="sortMobile" aria-label="정렬">
        <option value="discount">할인율순</option><option value="price">낮은 가격순</option><option value="depart">출발 임박순</option>
      </select>
    </div>
    <div class="offcanvas-lg offcanvas-bottom" tabindex="-1" id="filterPanel" style="--bs-offcanvas-height: 75vh">
      <div class="offcanvas-header">
        <h5 class="offcanvas-title">필터</h5>
        <button type="button" class="btn-close" data-bs-dismiss="offcanvas" data-bs-target="#filterPanel"></button>
      </div>
      <div class="offcanvas-body d-block">
        <form id="filterForm" class="np-filter p-3 mb-3 w-100">
          <div class="mb-3 d-flex flex-wrap gap-2" id="regionChips"></div>
          <div class="row g-2 align-items-end">
            <div class="col-6 col-lg-2">
              <label class="form-label small text-secondary mb-1">예산(1인)</label>
              <select class="form-select" name="price_max">
                <option value="">전체</option><option value="500000">50만 원 이하</option><option value="1000000">100만 원 이하</option>
                <option value="1500000">150만 원 이하</option><option value="2000000">200만 원 이하</option><option value="3000000">300만 원 이하</option>
              </select>
            </div>
            <div class="col-6 col-lg-2">
              <label class="form-label small text-secondary mb-1">출발월</label>
              <select class="form-select" name="month" id="monthSelect"><option value="">전체</option></select>
            </div>
            <div class="col-6 col-lg-2">
              <label class="form-label small text-secondary mb-1">여행사</label>
              <select class="form-select" name="agency" id="agencySelect"><option value="">전체</option></select>
            </div>
            <div class="col-6 col-lg-2">
              <label class="form-label small text-secondary mb-1">테마</label>
              <select class="form-select" name="theme" id="themeSelect"><option value="">전체</option></select>
            </div>
            <div class="col-12 col-lg-2">
              <label class="form-label small text-secondary mb-1">검색</label>
              <input class="form-control" name="q" placeholder="도시·상품명" maxlength="50">
            </div>
            <div class="col-12 col-lg-2 d-none d-lg-block">
              <label class="form-label small text-secondary mb-1">정렬</label>
              <select class="form-select" name="sort" id="sortSelect">
                <option value="discount">할인율순</option><option value="price">낮은 가격순</option><option value="depart">출발 임박순</option>
              </select>
            </div>
          </div>
          <div class="d-flex gap-2 mt-3 d-lg-none">
            <button type="button" class="btn btn-light flex-fill" id="resetBtn">초기화</button>
            <button type="submit" class="btn btn-primary flex-fill" data-bs-dismiss="offcanvas" data-bs-target="#filterPanel">적용</button>
          </div>
        </form>
      </div>
    </div>

    <div class="d-flex justify-content-between align-items-center mb-3">
      <div class="text-secondary small" id="resultInfo">불러오는 중...</div>
      <a href="recommend.html" class="btn btn-sm btn-outline-primary"><i class="bi bi-stars me-1"></i>내 취향 추천 보기</a>
    </div>

    <div class="np-cards" id="cards">
      <div class="np-card-wrap"><div class="skeleton"></div></div><div class="np-card-wrap"><div class="skeleton"></div></div>
      <div class="np-card-wrap"><div class="skeleton"></div></div><div class="np-card-wrap"><div class="skeleton"></div></div>
    </div>
    <div class="text-center my-4"><button class="btn btn-outline-secondary px-5 d-none" id="moreBtn">더 보기</button></div>
  </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/common.js"></script>
<script src="js/index.js"></script>
</body>
</html>
