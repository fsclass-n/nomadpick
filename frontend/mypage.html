<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>마이페이지 | NomadPick</title>
  <link rel="icon" href="img/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<main class="container py-4">
  <div class="np-panel p-4 mb-4 d-flex flex-column flex-md-row gap-3 align-items-md-center">
    <div class="np-rank" style="width:56px;height:56px;flex-basis:56px"><i class="bi bi-person fs-3"></i></div>
    <div class="flex-grow-1">
      <h1 class="h2 mb-0" id="userName">-</h1>
      <div class="text-secondary" id="userEmail">-</div>
    </div>
    <div class="d-flex gap-2">
      <a class="btn btn-outline-primary" href="preferences.html"><i class="bi bi-sliders me-1"></i>선호 설정</a>
      <a class="btn btn-primary" href="recommend.html"><i class="bi bi-stars me-1"></i>맞춤 추천</a>
    </div>
  </div>

  <div class="d-flex justify-content-between align-items-end mb-3">
    <h2 class="mb-0"><i class="bi bi-heart-fill text-danger me-1"></i>관심 상품</h2>
    <small class="text-secondary">등록 시점 가격 대비 하락하면 <span class="badge text-bg-success">가격 하락</span> 배지가 표시됩니다.</small>
  </div>
  <div id="favorites" class="d-flex flex-column gap-2"><div class="skeleton" style="height:90px"></div></div>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/common.js"></script>
<script src="js/mypage.js"></script>
</body>
</html>
