<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>수집 모니터링 | NomadPick 관리자</title>
  <link rel="icon" href="img/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<main class="container py-4">
  <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-2 mb-3">
    <h1 class="mb-0"><i class="bi bi-speedometer2 text-primary me-1"></i>RPA 수집 모니터링</h1>
    <div class="btn-group">
      <button class="btn btn-outline-primary" data-run="deals"><i class="bi bi-play-fill"></i> 특가 수집</button>
      <button class="btn btn-outline-primary" data-run="public"><i class="bi bi-airplane"></i> 공공데이터</button>
      <button class="btn btn-outline-primary" data-run="report"><i class="bi bi-file-earmark-bar-graph"></i> 리포트</button>
    </div>
  </div>

  <div class="row g-3 mb-4">
    <div class="col-6 col-lg-3"><div class="np-kpi"><div class="text-secondary small">오늘 수집 횟수</div><div class="value" id="kRuns">-</div></div></div>
    <div class="col-6 col-lg-3"><div class="np-kpi"><div class="text-secondary small">오늘 수집 상품 수</div><div class="value" id="kCollected">-</div></div></div>
    <div class="col-6 col-lg-3"><div class="np-kpi"><div class="text-secondary small">수집 성공률(7일)</div><div class="value text-success" id="kSuccess">-</div></div></div>
    <div class="col-6 col-lg-3"><div class="np-kpi"><div class="text-secondary small">파싱 실패율(오늘)</div><div class="value" id="kFail">-</div></div></div>
  </div>

  <div class="row g-4 mb-4">
    <div class="col-lg-7">
      <div class="np-panel p-3 h-100">
        <h2 class="h3">여행사별 수집 현황</h2>
        <div class="table-responsive"><table class="table table-np align-middle mb-0">
          <thead><tr><th>여행사</th><th>최근 수집</th><th>상태</th><th class="text-end">수집</th><th class="text-end">실패</th><th class="text-end">성공률</th></tr></thead>
          <tbody id="agencyRows"></tbody></table></div>
      </div>
    </div>
    <div class="col-lg-5">
      <div class="np-panel p-3 h-100">
        <h2 class="h3">일자별 수집 건수</h2>
        <div id="dailyChart" style="height:240px"></div>
      </div>
    </div>
  </div>

  <div class="row g-4">
    <div class="col-lg-8">
      <div class="np-panel p-3">
        <h2 class="h3">실행 로그 <small class="text-secondary fs-6 fw-normal">최근 7일</small></h2>
        <div class="table-responsive" style="max-height:420px"><table class="table table-sm table-np align-middle mb-0">
          <thead><tr><th>실행 시각</th><th>봇</th><th>여행사</th><th>상태</th><th>소스</th><th class="text-end">수집</th><th class="text-end">실패</th><th class="text-end">재시도</th><th>메시지</th></tr></thead>
          <tbody id="logRows"></tbody></table></div>
      </div>
    </div>
    <div class="col-lg-4">
      <div class="np-panel p-3">
        <h2 class="h3">일일 엑셀 리포트</h2>
        <ul class="list-group list-group-flush" id="reports"></ul>
      </div>
    </div>
  </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/common.js"></script>
<script src="js/admin.js"></script>
</body>
</html>
