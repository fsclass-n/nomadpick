<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NomadPick 발표 화면 | 3조</title>
  <link rel="icon" href="../../frontend/img/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <style>
    * { box-sizing:border-box; }
    html, body { margin:0; height:100%; background:#05080f; color:#e8eefb; font-family:"Pretendard","Malgun Gothic",sans-serif; }
    body { display:flex; flex-direction:column; }
    header { display:flex; align-items:center; gap:10px; padding:10px 16px; background:#0b1220; border-bottom:1px solid #1e2a44; flex-wrap:wrap; }
    header b { font-size:16px; margin-right:auto; } header b span { color:#fd7e14; }
    header a, header button { padding:7px 13px; border-radius:9px; border:1px solid #24365a; background:#121c30; color:#dfe9fb;
                              font:600 13px "Pretendard",sans-serif; text-decoration:none; cursor:pointer; }
    header .primary { background:linear-gradient(90deg,#f76707,#fd7e14); border:0; color:#fff; }
    #wrap { flex:1; position:relative; }
    iframe { position:absolute; inset:0; width:100%; height:100%; border:0; background:#000; }
    #tip { position:absolute; left:50%; bottom:18px; transform:translateX(-50%); padding:8px 14px; border-radius:999px; background:rgba(0,0,0,.65);
           font-size:13px; color:#cfd9ea; pointer-events:none; transition:opacity .6s; }
  </style>
</head>
<body>
  <header>
    <b>Nomad<span>Pick</span> 발표 화면 · 프로젝트_발표자료.pptx</b>
    <button class="primary" id="fs">전체 화면으로 발표</button>
    <a href="nomadpick.pptx" download="NomadPick_발표자료.pptx">PPTX 내려받기</a>
    <a href="../pdf/프로젝트_발표자료.pdf" target="_blank" rel="noopener">PDF</a>
    <a href="zoom.html" target="_blank" rel="noopener">줌 프레젠테이션</a>
    <a href="../../">소개 페이지</a>
  </header>
  <div id="wrap">
    <iframe id="deck" title="NomadPick 발표자료" allowfullscreen></iframe>
    <div id="tip">슬라이드를 클릭하거나 → / Space 키로 진행 · 애니메이션은 자동으로 재생됩니다</div>
  </div>
  <script>
    // PowerPoint Online(Office 웹 뷰어)으로 슬라이드쇼 재생 - 전환·애니메이션 그대로 표시
    const pptx = new URL("nomadpick.pptx", location.href).href;
    document.getElementById("deck").src = "https://view.officeapps.live.com/op/embed.aspx?src=" + encodeURIComponent(pptx);
    document.getElementById("fs").onclick = () => {
      const el = document.getElementById("wrap");
      document.fullscreenElement ? document.exitFullscreen() : el.requestFullscreen();
    };
    setTimeout(() => { document.getElementById("tip").style.opacity = 0; }, 6000);
  </script>
</body>
</html>
